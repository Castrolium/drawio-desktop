name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 29.0.4)'
        required: true
        type: string
      previous_version:
        description: 'Previous version for changelog (e.g., 29.0.3). Leave empty to auto-detect.'
        required: false
        type: string
      drawio_ref:
        description: 'draw.io ref to use (tag, branch, or commit). Leave empty to use v{version}'
        required: false
        type: string
      dry_run:
        description: 'Dry run - validate only, do not commit'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: '24'
  SNYK_CLI_VERSION: 'v1.1301.0'

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: Initialize security evidence environment
        run: |
          echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          echo "AUDIT_FAILED=false" >> $GITHUB_ENV
          echo "SNYK_EXPORT_FAILED=false" >> $GITHUB_ENV
          echo "SNYK_FINDINGS_DETECTED=false" >> $GITHUB_ENV
          echo "SNYK_REPORT_STATUS=not-run" >> $GITHUB_ENV
          echo "SNYK_FINDINGS_TOTAL=0" >> $GITHUB_ENV
          echo "SECURITY_EVIDENCE_ARTIFACT=security-evidence-pack-v${{ inputs.version }}" >> $GITHUB_ENV
          echo "SECURITY_EVIDENCE_STAGING_DIR=$RUNNER_TEMP/security-evidence-artifacts" >> $GITHUB_ENV
          echo "SECURITY_EVIDENCE_DIR=$RUNNER_TEMP/security-evidence-artifacts/security-evidence-pack-v${{ inputs.version }}" >> $GITHUB_ENV
          
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Validate security evidence contract
        run: |
          node ./build/security-evidence-preflight.mjs \
            --version "${{ inputs.version }}" \
            --require-node-major "${{ env.NODE_VERSION }}" \
            --command "prepare-release"
          
      - name: Log versions
        run: |
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          
      - name: Determine drawio ref
        run: |
          if [ -n "${{ inputs.drawio_ref }}" ]; then
            echo "DRAWIO_REF=${{ inputs.drawio_ref }}" >> $GITHUB_ENV
          else
            echo "DRAWIO_REF=v${{ inputs.version }}" >> $GITHUB_ENV
          fi
          
      - name: Update drawio submodule
        run: |
          cd drawio
          git fetch origin --tags
          
          # Check if ref exists
          if ! git rev-parse --verify "${{ env.DRAWIO_REF }}" >/dev/null 2>&1; then
            echo "::error::Ref '${{ env.DRAWIO_REF }}' not found in drawio repository"
            exit 1
          fi
          
          git checkout "${{ env.DRAWIO_REF }}"
          
          # Update any nested submodules in drawio
          git submodule update --init --recursive
          
          echo "DRAWIO_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "Updated drawio to: $(git describe --tags --always)"
          cd ..
          
      - name: Update package.json version
        run: |
          # Update version in package.json
          jq '.version = "${{ env.VERSION }}"' package.json > package.json.tmp
          mv package.json.tmp package.json
          
          echo "Updated package.json to version ${{ env.VERSION }}"
          grep '"version"' package.json
          
      - name: Install dependencies
        run: |
          # Clean install from scratch to ensure package-lock.json has all resolved URLs and integrity hashes.
          # Without this, entries carried over from a previous node_modules lack these fields,
          # which breaks offline/sandboxed builds like Flatpak (see #2301).
          rm -rf node_modules package-lock.json
          npm install

      - name: Run security evidence integration tests
        run: |
          npm run test:security-evidence

          echo "## Security Evidence Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Suite: \`npm run test:security-evidence\`" >> $GITHUB_STEP_SUMMARY
          echo "- Gate: \`blocking\`" >> $GITHUB_STEP_SUMMARY
          echo "- Scope: packaging + HTML summary generation and validation" >> $GITHUB_STEP_SUMMARY

      - name: Setup Snyk CLI
        id: setup_snyk
        continue-on-error: true
        uses: snyk/actions/setup@v1.0.0
        with:
          snyk-version: ${{ env.SNYK_CLI_VERSION }}

      - name: Export Snyk results
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          rm -f snyk-report.json snyk-export-error.txt
          SNYK_STATUS="not-run"

          echo "## Snyk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          write_snyk_export_error() {
            local reason="$1"
            local details="${2:-}"
            SNYK_STATUS="export-failed"
            rm -f snyk-report.json

            {
              echo "Snyk export failed"
              echo "Reason: ${reason}"

              if [ -n "$details" ]; then
                echo "Details: ${details}"
              fi

              echo "Command: snyk test --json-file-output=snyk-report.json"
            } > snyk-export-error.txt

            echo "SNYK_EXPORT_FAILED=true" >> $GITHUB_ENV
            echo "SNYK_FINDINGS_DETECTED=false" >> $GITHUB_ENV
            echo "SNYK_REPORT_STATUS=export-failed" >> $GITHUB_ENV
            echo "SNYK_FINDINGS_TOTAL=0" >> $GITHUB_ENV

            echo "::error::${reason}"
            echo "- Status: \`export-failed\`" >> $GITHUB_STEP_SUMMARY
            echo "- Details: ${reason}" >> $GITHUB_STEP_SUMMARY

            if [ -n "$details" ]; then
              echo "- Context: ${details}" >> $GITHUB_STEP_SUMMARY
            fi

            echo "- Artifact path: \`scans/snyk/snyk-export-error.txt\`" >> $GITHUB_STEP_SUMMARY
          }

          if [ "${{ steps.setup_snyk.outcome }}" != "success" ]; then
            write_snyk_export_error "Failed to install the Snyk CLI" "Setup step outcome: ${{ steps.setup_snyk.outcome }}"
            exit 0
          fi

          if [ -z "${SNYK_TOKEN}" ]; then
            write_snyk_export_error "Missing required GitHub secret: SNYK_TOKEN"
            exit 0
          fi

          set +e
          snyk test --json-file-output=snyk-report.json
          SNYK_EXIT=$?
          set -e

          if [ ! -f snyk-report.json ]; then
            write_snyk_export_error "Snyk CLI did not create snyk-report.json" "Exit code: ${SNYK_EXIT}"
            exit 0
          fi

          if ! jq empty snyk-report.json >/dev/null 2>&1; then
            write_snyk_export_error "Snyk CLI produced invalid JSON output" "Exit code: ${SNYK_EXIT}"
            exit 0
          fi

          TOTAL_FINDINGS=$(jq '(.vulnerabilities // []) | length' snyk-report.json)
          CRITICAL_FINDINGS=$(jq '[.vulnerabilities[]? | select(.severity == "critical")] | length' snyk-report.json)
          HIGH_FINDINGS=$(jq '[.vulnerabilities[]? | select(.severity == "high")] | length' snyk-report.json)
          MEDIUM_FINDINGS=$(jq '[.vulnerabilities[]? | select(.severity == "medium")] | length' snyk-report.json)
          LOW_FINDINGS=$(jq '[.vulnerabilities[]? | select(.severity == "low")] | length' snyk-report.json)

          echo "SNYK_FINDINGS_TOTAL=${TOTAL_FINDINGS}" >> $GITHUB_ENV

          if [ "${SNYK_EXIT}" -eq 0 ]; then
            SNYK_STATUS="no-findings"
            echo "SNYK_EXPORT_FAILED=false" >> $GITHUB_ENV
            echo "SNYK_FINDINGS_DETECTED=false" >> $GITHUB_ENV
            echo "SNYK_REPORT_STATUS=no-findings" >> $GITHUB_ENV
          elif [ "${SNYK_EXIT}" -eq 1 ]; then
            SNYK_STATUS="findings-detected"
            echo "SNYK_EXPORT_FAILED=false" >> $GITHUB_ENV
            echo "SNYK_FINDINGS_DETECTED=true" >> $GITHUB_ENV
            echo "SNYK_REPORT_STATUS=findings-detected" >> $GITHUB_ENV
            echo "::warning::Snyk reported ${TOTAL_FINDINGS} finding(s); the export was preserved for review"
          else
            write_snyk_export_error "Snyk CLI failed before a usable export could be produced" "Exit code: ${SNYK_EXIT}"
            exit 0
          fi

          echo "- Status: \`${SNYK_STATUS}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Findings total: \`${TOTAL_FINDINGS}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Critical: \`${CRITICAL_FINDINGS}\`" >> $GITHUB_STEP_SUMMARY
          echo "- High: \`${HIGH_FINDINGS}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Medium: \`${MEDIUM_FINDINGS}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Low: \`${LOW_FINDINGS}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact path: \`scans/snyk/snyk-report.json\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate SBOM
        run: |
          npm run generate-sbom

          if ! jq -e '.bomFormat == "CycloneDX"' sbom.cdx.json >/dev/null 2>&1; then
            echo "::error::Generated SBOM is not a valid CycloneDX JSON document"
            exit 1
          fi

          SBOM_SPEC_VERSION=$(jq -r '.specVersion // "unknown"' sbom.cdx.json)
          SBOM_COMPONENT_COUNT=$(jq '(.components // []) | length' sbom.cdx.json)

          echo "## SBOM" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- File: \`sbom/sbom.cdx.json\`" >> $GITHUB_STEP_SUMMARY
          echo "- Format: \`CycloneDX JSON\`" >> $GITHUB_STEP_SUMMARY
          echo "- Spec version: \`${SBOM_SPEC_VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Components: \`${SBOM_COMPONENT_COUNT}\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate release notes
        run: |
          VERSION="${{ env.VERSION }}"
          PREV_VERSION="${{ inputs.previous_version }}"
          
          # Auto-detect previous version if not provided
          if [ -z "$PREV_VERSION" ]; then
            PREV_VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "")
          fi
          
          # Get electron version from package-lock.json (actual installed version)
          ELECTRON_VERSION=$(jq -r '.packages["node_modules/electron"].version' package-lock.json)
          echo "ELECTRON_VERSION=$ELECTRON_VERSION" >> $GITHUB_ENV
          
          # Generate release notes
          cat > release-notes.md << 'RELEASE_EOF'
          ## Release Notes for VERSION_PLACEHOLDER
          
          [Windows Installer](https://github.com/jgraph/drawio-desktop/releases/download/vVERSION_PLACEHOLDER/draw.io-VERSION_PLACEHOLDER-windows-installer.exe)
          [Windows No Installer (zip)](https://github.com/jgraph/drawio-desktop/releases/download/vVERSION_PLACEHOLDER/draw.io-VERSION_PLACEHOLDER-windows.zip)
          [macOS - Universal](https://github.com/jgraph/drawio-desktop/releases/download/vVERSION_PLACEHOLDER/draw.io-universal-VERSION_PLACEHOLDER.dmg)
          Linux - [deb](https://github.com/jgraph/drawio-desktop/releases/download/vVERSION_PLACEHOLDER/drawio-amd64-VERSION_PLACEHOLDER.deb), [AppImage](https://github.com/jgraph/drawio-desktop/releases/download/vVERSION_PLACEHOLDER/drawio-x86_64-VERSION_PLACEHOLDER.AppImage) or [rpm](https://github.com/jgraph/drawio-desktop/releases/download/vVERSION_PLACEHOLDER/drawio-x86_64-VERSION_PLACEHOLDER.rpm)
          Windows intel x32 releases are marked -ia32-
          
          **ChangeLog:**
          - Uses electron ELECTRON_PLACEHOLDER.
          - Updates to [draw.io core VERSION_PLACEHOLDER](https://github.com/jgraph/drawio/blob/vVERSION_PLACEHOLDER/ChangeLog).PREV_PLACEHOLDER
          RELEASE_EOF
          
          # Replace placeholders
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" release-notes.md
          sed -i "s/ELECTRON_PLACEHOLDER/${ELECTRON_VERSION}/g" release-notes.md
          if [ -n "$PREV_VERSION" ]; then
            sed -i "s/PREV_PLACEHOLDER/ All changes from ${PREV_VERSION} to ${VERSION} are added in this build./g" release-notes.md
          else
            sed -i "s/PREV_PLACEHOLDER//g" release-notes.md
          fi
          
          echo "## Generated Release Notes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat release-notes.md >> $GITHUB_STEP_SUMMARY
          
          echo "Release notes generated with Electron version: $ELECTRON_VERSION"
        
      - name: Security audit
        id: audit
        continue-on-error: true
        run: |
          echo "## npm audit results" >> $GITHUB_STEP_SUMMARY
          echo "AUDIT_FAILED=true" >> $GITHUB_ENV
          
          # Run audit and keep the JSON output parseable for later packaging/validation.
          if npm audit --json > audit-results.json; then
            AUDIT_EXIT=0
          else
            AUDIT_EXIT=$?
          fi

          if ! jq empty audit-results.json >/dev/null 2>&1; then
            echo "::error::npm audit did not produce valid JSON output"
            exit 1
          fi
          
          # Parse results
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' audit-results.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit-results.json)
          MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' audit-results.json)
          LOW=$(jq '.metadata.vulnerabilities.low // 0' audit-results.json)
          
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Moderate | $MODERATE |" >> $GITHUB_STEP_SUMMARY
          echo "| Low | $LOW |" >> $GITHUB_STEP_SUMMARY
          
          # Save for artifact
          npm audit > audit-report.txt 2>&1 || true
          
          # Fail if critical or high vulnerabilities
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::Security vulnerabilities found: $CRITICAL critical, $HIGH high"
          else
            echo "AUDIT_FAILED=false" >> $GITHUB_ENV
          fi
          
      - name: Check outdated dependencies
        run: |
          echo "## Outdated dependencies" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm outdated >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          npm outdated > outdated-report.txt 2>&1 || true

      - name: Generate HTML security summary
        id: generate_summary
        continue-on-error: true
        run: |
          npm run generate-security-summary -- \
            --version "${{ env.VERSION }}" \
            --repository "${{ github.server_url }}/${{ github.repository }}" \
            --workflow-name "${{ github.workflow }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --git-ref "${{ github.ref }}" \
            --git-commit "${{ github.sha }}" \
            --drawio-ref "${{ env.DRAWIO_REF }}" \
            --drawio-commit "${{ env.DRAWIO_COMMIT }}" \
            --node-version "$(node --version)" \
            --npm-version "$(npm --version)" \
            --electron-version "${{ env.ELECTRON_VERSION }}" \
            --generated-at "$(date --utc +%Y-%m-%dT%H:%M:%SZ)"

          echo "## HTML Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- File: \`summary/security-summary.html\`" >> $GITHUB_STEP_SUMMARY
          echo "- Purpose: readable release context, evidence inventory, audit, Snyk, and SBOM overview" >> $GITHUB_STEP_SUMMARY
          
      - name: Package security evidence
        id: package_security_evidence
        continue-on-error: true
        run: |
          rm -rf "${{ env.SECURITY_EVIDENCE_STAGING_DIR }}"
          PACKAGE_EXIT=0
          npm run package-security-evidence -- \
            --version "${{ env.VERSION }}" \
            --output-dir "${{ env.SECURITY_EVIDENCE_STAGING_DIR }}" \
            --generated-at "$(date --utc +%Y-%m-%dT%H:%M:%SZ)" || PACKAGE_EXIT=$?

          echo "## Security Evidence Artifact" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Artifact: \`${{ env.SECURITY_EVIDENCE_ARTIFACT }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Structure: \`summary/\`, \`release/\`, \`scans/npm/\`, \`scans/snyk/\`, \`sbom/\`" >> $GITHUB_STEP_SUMMARY
          if [ "${PACKAGE_EXIT}" -eq 0 ]; then
            echo "- Validation: \`passed\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Validation: \`failed\` (artifact staged for troubleshooting and will still be uploaded)" >> $GITHUB_STEP_SUMMARY
          fi

          exit "${PACKAGE_EXIT}"

      - name: Upload security evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SECURITY_EVIDENCE_ARTIFACT }}
          path: ${{ env.SECURITY_EVIDENCE_STAGING_DIR }}
          retention-days: 365

      - name: Generate release summary
        if: always()
        run: |
          echo "## Release Preparation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ env.VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Electron | ${{ env.ELECTRON_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| drawio ref | ${{ env.DRAWIO_REF }} |" >> $GITHUB_STEP_SUMMARY
          echo "| drawio commit | ${{ env.DRAWIO_COMMIT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security evidence artifact | ${{ env.SECURITY_EVIDENCE_ARTIFACT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Snyk CLI | ${{ env.SNYK_CLI_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Snyk export status | ${{ env.SNYK_REPORT_STATUS }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Snyk findings total | ${{ env.SNYK_FINDINGS_TOTAL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js | $(node --version) |" >> $GITHUB_STEP_SUMMARY
          echo "| npm | $(npm --version) |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry run | ${{ inputs.dry_run }} |" >> $GITHUB_STEP_SUMMARY

      - name: Enforce post-upload security requirements
        if: always() && (env.AUDIT_FAILED == 'true' || env.SNYK_EXPORT_FAILED == 'true' || steps.generate_summary.outcome != 'success' || steps.package_security_evidence.outcome != 'success')
        run: |
          if [ "${{ env.AUDIT_FAILED }}" = "true" ]; then
            echo "::error::Cannot proceed with release due to npm audit vulnerabilities"
            echo "Review audit-report.txt and fix vulnerabilities before releasing"
          fi

          if [ "${{ env.SNYK_EXPORT_FAILED }}" = "true" ]; then
            echo "::error::Cannot proceed with release because Snyk export failed"
            echo "Review snyk-export-error.txt in the security evidence artifact and fix the export issue before releasing"
          fi

          if [ "${{ steps.generate_summary.outcome }}" != "success" ]; then
            echo "::error::Cannot proceed with release because the generated HTML security summary was unavailable"
            echo "Review the workflow log and the fallback summary in the uploaded security evidence artifact before releasing"
          fi

          if [ "${{ steps.package_security_evidence.outcome }}" != "success" ]; then
            echo "::error::Cannot proceed with release because the staged security evidence artifact failed strict validation"
            echo "Review the uploaded security evidence artifact and the packaging step log to fix the contract violations before releasing"
          fi

          exit 1
          
      - name: Commit changes
        if: inputs.dry_run == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Save release notes content before cleanup
          cp release-notes.md /tmp/release-notes.md
          
          # Create release branch
          git checkout -b "releases/v${{ env.VERSION }}"
          
          # Remove generated files that shouldn't be committed
          # (package-lock.json IS committed to lock electron version)
          rm -f audit-results.json audit-report.txt outdated-report.txt release-notes.md sbom.cdx.json snyk-report.json snyk-export-error.txt
          rm -rf summary
          
          git add -A
          git commit -m "Prepare release v${{ env.VERSION }}

          - Updated drawio submodule to ${{ env.DRAWIO_REF }} (${{ env.DRAWIO_COMMIT }})
          - Updated package.json version to ${{ env.VERSION }}
          - Updated package-lock.json
          - Electron version: ${{ env.ELECTRON_VERSION }}
          
          Automated by prepare-release workflow"
          
          git push origin "releases/v${{ env.VERSION }}"
          
          # Restore release notes for PR creation
          cp /tmp/release-notes.md release-notes.md
          
      - name: Create Pull Request
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the release notes content
          RELEASE_NOTES=$(cat release-notes.md)
          
          # Create PR
          PR_URL=$(gh pr create \
            --base dev \
            --head "releases/v${{ env.VERSION }}" \
            --title "Release v${{ env.VERSION }}" \
            --body "## Release Preparation

          This PR prepares release v${{ env.VERSION }}.

          ### Changes
          - Updated drawio submodule to ${{ env.DRAWIO_REF }}
          - Updated package.json version to ${{ env.VERSION }}
          - Electron version: ${{ env.ELECTRON_VERSION }}

          ### Audit Results
          - npm audit: ✅ No critical/high vulnerabilities

          ### After Merging
          Create and push the tag to trigger builds:
          \`\`\`bash
          git checkout dev
          git pull
          git tag -a v${{ env.VERSION }} -m \"Release v${{ env.VERSION }}\"
          git push origin v${{ env.VERSION }}
          \`\`\`

          ---

          ${RELEASE_NOTES}
          ")
          
          echo "## Pull Request Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "PR: ${PR_URL}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review and merge the PR" >> $GITHUB_STEP_SUMMARY
          echo "2. Create the tag: \`git tag -a v${{ env.VERSION }} -m \"Release v${{ env.VERSION }}\"\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Push the tag: \`git push origin v${{ env.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          
      - name: Summary
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::Dry run complete. No changes committed."
          else
            echo "::notice::Release PR created for v${{ env.VERSION }}. Review, merge, then create tag to trigger builds."
          fi
